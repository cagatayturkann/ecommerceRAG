# Local vector store for development: Weaviate plus a small CPU embedding model (Model2Vec).
# Ports are bound to 127.0.0.1 only. Anonymous access is enabled, so never expose this setup publicly.
services:
  weaviate:
    image: cr.weaviate.io/semitechnologies/weaviate:1.40.7
    restart: unless-stopped
    ports:
      - "127.0.0.1:8090:8080"   # REST
      - "127.0.0.1:50061:50051" # gRPC
    environment:
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      DEFAULT_VECTORIZER_MODULE: none
      ENABLE_MODULES: text2vec-model2vec
      MODEL2VEC_INFERENCE_API: http://text2vec-model2vec:8080
      CLUSTER_HOSTNAME: node1
    volumes:
      - weaviate_data:/var/lib/weaviate
    depends_on:
      - text2vec-model2vec

  text2vec-model2vec:
    image: cr.weaviate.io/semitechnologies/model2vec-inference:minishlab-potion-retrieval-32M-1.2.1
    restart: unless-stopped

volumes:
  weaviate_data:
